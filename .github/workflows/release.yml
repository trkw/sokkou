# main への push ごとに dmg を組み立て、GitHub のリリースに Latest として置く。
# 版は 0.1.<実行番号>。install.sh は /releases/latest から最新を取る
# Actions が止まっていたなどで出しそびれたときは、Actions の画面から main で手で動かせる
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

# 同じ番号の衝突を避けるため直列にする。途中で取り消すと tag だけ残るので取り消さない
concurrency:
  group: release

jobs:
  # 外部のパッケージを組み立てるので、書き込みの権限を持たせない
  build:
    # 手で動かすときも main からだけ出す
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - id: version
        run: echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Build .app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: SOKKOU_BUILD_CHANNEL=stable SOKKOU_VERSION="${VERSION}" SOKKOU_BUILD_LABEL="v${VERSION}" SOKKOU_COMMIT="${GITHUB_SHA}" scripts/build-app.sh

      - name: Check .app
        run: scripts/check-app.sh dist/sokkou.app

      # 署名と公証は鍵を持たせた sign ジョブでする。zip にしないとフレームワークのリンクが崩れる
      - name: Pack .app
        run: ditto -c -k --keepParent dist/sokkou.app dist/sokkou-app.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sokkou-app
          path: dist/sokkou-app.zip
          if-no-files-found: error
          retention-days: 1

  # Developer ID で署名して公証を受け、dmg にする（docs/signing.md）。外部のパッケージは組み立てず、鍵はここにだけ渡す
  sign:
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sokkou-app
          path: dist

      - name: Unpack .app
        run: ditto -x -k dist/sokkou-app.zip dist && rm dist/sokkou-app.zip

      - name: Sign, notarize and make dmg
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/sign-and-notarize.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sokkou-macos-arm64
          path: dist/sokkou-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sokkou-macos-arm64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --generate-notes --latest --target "${GITHUB_SHA}" dist/sokkou-macos-arm64.dmg
