name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# macOS のジョブが使う Xcode。ランナーのイメージ（macos-26）とともに版を固定する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Test
        run: swift test

  app:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Build .app
        run: SOKKOU_BUILD_CHANNEL=stable scripts/build-app.sh

      - name: Check .app
        run: scripts/check-app.sh dist/sokkou.app
