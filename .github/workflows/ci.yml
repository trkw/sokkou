name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# macOS のジョブが使う Xcode。ランナーのイメージ（macos-26）とともに版を固定する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Test
        run: swift test

  app:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      # PR のビルドは pr-<番号> のプレリリースに置き、install.sh --pr <番号> と入力メニューから入れられるようにする
      - name: Build .app
        env:
          SOKKOU_BUILD_LABEL: ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }}
          SOKKOU_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: SOKKOU_BUILD_CHANNEL=stable scripts/build-app.sh

      - name: Check .app
        run: scripts/check-app.sh dist/sokkou.app

      # dmg を作れるかと、dmg の外（dist）から --install で入れられるか
      - name: Make dmg
        run: scripts/make-dmg.sh

      - name: Install from .app
        run: dist/sokkou.app/Contents/MacOS/sokkou --install

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: sokkou-macos-arm64
          path: dist/sokkou-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

      # 候補の窓とモードの札の見た目を画像に書き出す
      - name: Snapshot UI
        run: dist/sokkou.app/Contents/MacOS/sokkou --snapshot snapshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: snapshots
          if-no-files-found: error
          retention-days: 7

  # 書き出した画像を ui-snapshots ブランチに置き、ブラウザや git から見られるようにする。
  # 外部のパッケージを組み立てるジョブとは分け、書き込みの権限はここにだけ持たせる
  snapshots:
    needs: app
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-snapshots
          path: snapshots

      - name: Push to ui-snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd snapshots
          git init -q -b ui-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI snapshots for ${SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-snapshots

  # PR の dmg を pr-<番号> のプレリリースに置く。push のたびに置き直し、PR を閉じたら pr-build-cleanup.yml が消す
  pr-build:
    needs: app
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: pr-${{ github.event.pull_request.number }}
      NUMBER: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sokkou-macos-arm64
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease --latest=false --target "${SHA}" \
            --title "PR #${NUMBER} のビルド" \
            --notes "PR #${NUMBER} の ${SHA:0:7} を組み立てたもの。入れるには入力メニューの「PR の版を入れる…」か、install.sh --pr ${NUMBER}" \
            dist/sokkou-macos-arm64.dmg
