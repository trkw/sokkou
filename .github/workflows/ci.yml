name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# macOS のジョブが使う Xcode。ランナーのイメージ（macos-26）とともに版を固定する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Test
        run: swift test

  app:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Build .app
        run: SOKKOU_BUILD_CHANNEL=stable scripts/build-app.sh

      - name: Check .app
        run: scripts/check-app.sh dist/sokkou.app

      # dmg を作れるかと、dmg の外（dist）から --install で入れられるか
      - name: Make dmg
        run: scripts/make-dmg.sh

      - name: Install from .app
        run: dist/sokkou.app/Contents/MacOS/sokkou --install

      # 候補の窓とモードの札の見た目を画像に書き出す
      - name: Snapshot UI
        run: dist/sokkou.app/Contents/MacOS/sokkou --snapshot snapshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: snapshots
          if-no-files-found: error
          retention-days: 7

  # 書き出した画像を ui-snapshots ブランチに置き、ブラウザや git から見られるようにする。
  # 外部のパッケージを組み立てるジョブとは分け、書き込みの権限はここにだけ持たせる
  snapshots:
    needs: app
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-snapshots
          path: snapshots

      - name: Push to ui-snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd snapshots
          git init -q -b ui-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI snapshots for ${SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-snapshots
